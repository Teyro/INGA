<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>INGA</title>
<style>
  html, body {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6ea8ff, #3d6fe0);
    font-family: -apple-system, "Segoe UI Variable", "Segoe UI", "Noto Sans", sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  .box { text-align: center; color: #fff; }
  img { width: 120px; height: 120px; filter: drop-shadow(0 8px 20px rgb(0 0 0 / 0.25)); }
  h1 { margin: 16px 0 8px; font-size: 1.6rem; letter-spacing: 0.02em; font-weight: 800; }
  p { margin: 0; opacity: 0.92; font-size: 0.92rem; max-width: 320px; }
  .dots { margin-top: 20px; display: flex; gap: 6px; justify-content: center; }
  .dots span { width: 7px; height: 7px; border-radius: 999px; background: rgb(255 255 255 / 0.75); animation: pulse 1.1s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }
  .status {
    margin-top: 12px;
    font-size: 0.82rem;
    min-height: 1.1em; /* reserviert die Zeile, kein Ruckeln beim ersten Text */
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="img/icon-256.png" alt="INGA" />
    <h1>Danke fürs Benutzen von INGA!</h1>
    <div class="dots" id="dots"><span></span><span></span><span></span></div>
    <p class="status" id="status">Bis bald!</p>
  </div>

<script src="js/abschied.js"></script>
</body>
</html>
