<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>INGA</title>
<style>
  html, body {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6ea8ff, #3d6fe0);
    font-family: -apple-system, "Segoe UI Variable", "Segoe UI", "Noto Sans", sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  .box { text-align: center; color: #fff; }
  img { width: 128px; height: 128px; filter: drop-shadow(0 8px 20px rgb(0 0 0 / 0.25)); }
  h1 { margin: 18px 0 6px; font-size: 2.2rem; letter-spacing: 0.04em; font-weight: 800; }
  p { margin: 0; opacity: 0.92; font-size: 0.92rem; max-width: 320px; }
  .dots { margin-top: 22px; display: flex; gap: 6px; justify-content: center; }
  .dots span { width: 7px; height: 7px; border-radius: 999px; background: rgb(255 255 255 / 0.75); animation: pulse 1.1s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }
  .tip {
    margin-top: 26px;
    padding-top: 14px;
    border-top: 1px solid rgb(255 255 255 / 0.25);
    font-size: 0.82rem;
    opacity: 0;
    animation: einblenden 0.5s ease-out 0.2s forwards;
  }
  @keyframes einblenden { from { opacity: 0; transform: translateY(4px); } to { opacity: 0.85; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="box">
    <img src="../../build/icon-256.png" alt="INGA" />
    <h1>INGA</h1>
    <p>INGA Ist Nicht Genehmigungspflichtige Anschaffung</p>
    <div class="dots"><span></span><span></span><span></span></div>
    <p class="tip" id="tip"></p>
  </div>

<script src="js/splash.js"></script>
</body>
</html>
